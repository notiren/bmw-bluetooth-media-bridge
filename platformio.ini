; e9x-kcan-media-control - BMW E9x K-CAN steering-wheel buttons -> phone media control (ESP32)
;
; Environments:
;   logger_*  - listen-only CAN logger (step 1: verify 0x1D6). Works on ESP32 / S3 / C3.
;   app_ble_*  - S3/C3: steering wheel -> BLE media keys to phone; audio via a separate BT-AUX receiver.
;   app_a2dp_* - CLASSIC ESP32 only: A2DP sink -> PCM5102 + AVRCP steering-wheel control.
;
; CAN backend: default is the ESP32 built-in TWAI controller + SN65HVD230 transceiver.
; Use the *_mcp2515 environments for an MCP2515 module instead.
;
; Build/flash example:  pio run -e logger_esp32c3_mcp2515 -t upload && pio device monitor -e logger_esp32c3_mcp2515

[platformio]
default_envs = logger_esp32c3_mcp2515, app_ble_esp32c3_mcp2515

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DCAN_BITRATE=100000        ; K-CAN = 100 kbit/s, D-CAN (OBD) = 500 kbit/s

; ---------- shared per-chip pin defaults (TWAI) ----------
[chip_esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DCAN_TX_PIN=17
    -DCAN_RX_PIN=16

[chip_esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    -DARDUINO_USB_CDC_ON_BOOT=1

[chip_esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    ; ESP32-C3-DevKitM-1: micro-USB goes through a CP2102 to UART0, so Serial = UART0.
    ; Boards with native USB-C only (e.g. SuperMini): set ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1.
    -DARDUINO_USB_CDC_ON_BOOT=0

[mcp2515]
lib_deps = autowp/autowp-mcp2515 @ ^1.2.1
build_flags =
    -DCAN_BACKEND_MCP2515=1
    -DMCP2515_CRYSTAL_MHZ=8     ; check the crystal on your module (8 or 16)

; Per-chip SPI pins for the MCP2515 module
[mcp2515_esp32]
lib_deps = ${mcp2515.lib_deps}
build_flags =
    ${chip_esp32.build_flags}
    ${mcp2515.build_flags}
    -DMCP2515_CS_PIN=5
    -DMCP2515_SCK_PIN=18
    -DMCP2515_MISO_PIN=19
    -DMCP2515_MOSI_PIN=23

[mcp2515_s3]
lib_deps = ${mcp2515.lib_deps}
build_flags =
    ${chip_esp32s3.build_flags}
    ${mcp2515.build_flags}
    -DMCP2515_CS_PIN=10
    -DMCP2515_SCK_PIN=12
    -DMCP2515_MISO_PIN=13
    -DMCP2515_MOSI_PIN=11

; C3: avoid strapping pins 2/8/9 and USB pins 18/19
[mcp2515_c3]
lib_deps = ${mcp2515.lib_deps}
build_flags =
    ${chip_esp32c3.build_flags}
    ${mcp2515.build_flags}
    -DMCP2515_CS_PIN=4
    -DMCP2515_SCK_PIN=7
    -DMCP2515_MISO_PIN=5
    -DMCP2515_MOSI_PIN=6

; ---------- CAN logger ----------
[logger]
build_src_filter = +<common/> +<logger/>

[env:logger_esp32]
extends = chip_esp32, logger

[env:logger_esp32s3]
extends = chip_esp32s3, logger

[env:logger_esp32c3]
extends = chip_esp32c3, logger

[env:logger_esp32c3_mcp2515]
extends = chip_esp32c3, logger
lib_deps = ${mcp2515_c3.lib_deps}
build_flags = ${mcp2515_c3.build_flags}

[env:logger_esp32_mcp2515]
extends = chip_esp32, logger
lib_deps = ${mcp2515_esp32.lib_deps}
build_flags = ${mcp2515_esp32.build_flags}

[env:logger_esp32s3_mcp2515]
extends = chip_esp32s3, logger
lib_deps = ${mcp2515_s3.lib_deps}
build_flags = ${mcp2515_s3.build_flags}

; ---------- app_ble: S3 / C3 -> BLE media keys (audio via separate BT-AUX receiver) ----------
[app_ble]
build_src_filter = +<common/> +<app_ble/>
lib_deps = h2zero/NimBLE-Arduino @ ^1.4.2

[env:app_ble_esp32s3]
extends = chip_esp32s3, app_ble

[env:app_ble_esp32c3]
extends = chip_esp32c3, app_ble

[env:app_ble_esp32c3_mcp2515]
extends = chip_esp32c3, app_ble
lib_deps =
    ${app_ble.lib_deps}
    ${mcp2515.lib_deps}
build_flags = ${mcp2515_c3.build_flags}

[env:app_ble_esp32s3_mcp2515]
extends = chip_esp32s3, app_ble
lib_deps =
    ${app_ble.lib_deps}
    ${mcp2515.lib_deps}
build_flags = ${mcp2515_s3.build_flags}

; ---------- app_a2dp: CLASSIC ESP32 only -> A2DP sink + PCM5102 + AVRCP ----------
[app_a2dp]
build_src_filter = +<common/> +<app_a2dp/>
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git

[env:app_a2dp_esp32]
extends = chip_esp32, app_a2dp

[env:app_a2dp_esp32_mcp2515]
extends = chip_esp32, app_a2dp
lib_deps =
    ${app_a2dp.lib_deps}
    ${mcp2515.lib_deps}
build_flags = ${mcp2515_esp32.build_flags}
