; bmw-bluetooth-media-bridge - BMW steering-wheel buttons (K-CAN) + Bluetooth audio -> phone (ESP32)
;
; Environments:
;   app_a2dp_esp32          - main: CLASSIC ESP32 A2DP sink -> PCM5102, AVRCP steering-wheel
;                             control, Wi-Fi dashboard + OTA
;   app_ble_esp32c3         - alternative: C3 + SN65HVD230, steering wheel -> BLE media keys
;                             + Wi-Fi dashboard; audio via a separate BT-AUX receiver
;
; Build/flash example:  pio run -e app_a2dp_esp32 -t upload && pio device monitor -e app_a2dp_esp32

[platformio]
default_envs = app_a2dp_esp32

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DFW_VERSION=\"1.6\"         ; shown at boot and on the dashboard
    -DCAN_BITRATE=100000        ; K-CAN = 100 kbit/s, D-CAN (OBD) = 500 kbit/s

; ---------- ESP32-C3-DevKitM-1: built-in CAN (TWAI) + SN65HVD230 ----------
; Pins avoid strapping pins 2/8/9 and USB pins 18/19.
[c3_twai]
board = esp32-c3-devkitm-1
lib_deps = autowp/autowp-mcp2515 @ ^1.2.1   ; only built with CAN_BACKEND_MCP2515=1
build_flags =
    ${env.build_flags}
    ; micro-USB goes through a CP2102 to UART0, so Serial = UART0.
    ; Boards with native USB only (e.g. SuperMini): set ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    ; Optional MCP2515 module (SPI) instead of TWAI: replace the two CAN_* pins above with
    ; -DCAN_BACKEND_MCP2515=1
    ; -DMCP2515_CRYSTAL_MHZ=8     ; check the crystal on your module (8 or 16)
    ; -DMCP2515_CS_PIN=4
    ; -DMCP2515_SCK_PIN=7
    ; -DMCP2515_MISO_PIN=5
    ; -DMCP2515_MOSI_PIN=6
    ; -DMCP2515_INT_PIN=10        ; optional, via divider; works unwired (slower poll)

[env:app_ble_esp32c3]
extends = c3_twai
build_src_filter = +<common/> +<app_ble/>
lib_deps =
    ${c3_twai.lib_deps}
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    ${c3_twai.build_flags}
    -DENABLE_DASHBOARD=1        ; Wi-Fi dashboard + OTA (needs include/secrets.h); 0 = buttons only
    ; -DBENCH_FAKE_CAN=1        ; bench test without a car: fake K-CAN frames instead of the transceiver

; ---------- CLASSIC ESP32 (WROOM-32): built-in CAN (TWAI) + SN65HVD230 ----------
[esp32_twai]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DCAN_TX_PIN=17
    -DCAN_RX_PIN=16

; A2DP sink -> PCM5102 DAC -> AUX, buttons via AVRCP. Does not build for S3/C3.
; PCM5102 I2S pins: BCK 26, LRCK 25, DIN 33 (defaults in src/app_a2dp/main.cpp).
[env:app_a2dp_esp32]
extends = esp32_twai
build_src_filter = +<common/> +<app_a2dp/>
; two ~1.9 MB app slots for OTA (A2DP + dashboard is ~1.8 MB)
board_build.partitions = min_spiffs.csv
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
build_flags =
    ${esp32_twai.build_flags}
    -DENABLE_DASHBOARD=1        ; Wi-Fi dashboard + OTA (needs include/secrets.h); 0 = buttons only
    ; -DBENCH_FAKE_CAN=1        ; bench test without a car: fake K-CAN frames instead of the SN65HVD230
