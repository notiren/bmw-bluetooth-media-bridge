; e9x-kcan-media-control - BMW E9x K-CAN steering-wheel buttons -> phone media control (ESP32)
;
; Environments:
;   app_ble_esp32c3_mcp2515 - steering wheel -> BLE media keys + Wi-Fi dashboard;
;                             audio via a separate BT-AUX receiver
;   app_a2dp_esp32          - CLASSIC ESP32: A2DP sink -> PCM5102 + AVRCP steering-wheel control
;
; Build/flash example:  pio run -e app_ble_esp32c3_mcp2515 -t upload && pio device monitor -e app_ble_esp32c3_mcp2515

[platformio]
default_envs = app_ble_esp32c3_mcp2515

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DFW_VERSION=\"1.5\"         ; shown at boot and on the dashboard
    -DCAN_BITRATE=100000        ; K-CAN = 100 kbit/s, D-CAN (OBD) = 500 kbit/s

; ---------- ESP32-C3-DevKitM-1 + MCP2515 module ----------
; Pins avoid strapping pins 2/8/9 and USB pins 18/19.
[c3_mcp2515]
board = esp32-c3-devkitm-1
lib_deps = autowp/autowp-mcp2515 @ ^1.2.1
build_flags =
    ${env.build_flags}
    ; micro-USB goes through a CP2102 to UART0, so Serial = UART0.
    ; Boards with native USB only (e.g. SuperMini): set ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCAN_BACKEND_MCP2515=1
    -DMCP2515_CRYSTAL_MHZ=8     ; check the crystal on your module (8 or 16)
    -DMCP2515_CS_PIN=4
    -DMCP2515_SCK_PIN=7
    -DMCP2515_MISO_PIN=5
    -DMCP2515_MOSI_PIN=6
    -DMCP2515_INT_PIN=10        ; optional, via divider; works unwired (slower poll)

[env:app_ble_esp32c3_mcp2515]
extends = c3_mcp2515
build_src_filter = +<common/> +<app_ble/>
lib_deps =
    ${c3_mcp2515.lib_deps}
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    ${c3_mcp2515.build_flags}
    -DENABLE_DASHBOARD=1        ; Wi-Fi dashboard + OTA (needs include/secrets.h); 0 = buttons only
    ; -DBENCH_FAKE_CAN=1        ; bench test without a car: fake K-CAN frames instead of the MCP2515

; ---------- CLASSIC ESP32 (WROOM-32): built-in CAN (TWAI) + SN65HVD230 ----------
[esp32_twai]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DCAN_TX_PIN=17
    -DCAN_RX_PIN=16

; A2DP sink -> PCM5102 DAC -> AUX, buttons via AVRCP. Does not build for S3/C3.
[env:app_a2dp_esp32]
extends = esp32_twai
build_src_filter = +<common/> +<app_a2dp/>
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
