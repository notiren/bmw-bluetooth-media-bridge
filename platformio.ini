; BMW steering-wheel buttons (K-CAN) + Bluetooth audio (ESP32)
;   app_a2dp_esp32  - ESP32: A2DP -> PCM5102, AVRCP buttons, dashboard + OTA
;   app_ble_esp32c3 - ESP32-C3: BLE media keys, dashboard + OTA

[platformio]
default_envs = app_a2dp_esp32

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DFW_VERSION=\"1.6\"
    -DCAN_BITRATE=100000        ; K-CAN
    -DENABLE_DASHBOARD=1        ; needs include/secrets.h
    ; -DBENCH_FAKE_CAN=1        ; fake K-CAN frames for bench tests

; ESP32 (WROOM-32) + SN65HVD230 + PCM5102 (I2S pins in src/app_a2dp/main.cpp)
[env:app_a2dp_esp32]
board = esp32dev
board_build.partitions = min_spiffs.csv   ; two app slots, needed for OTA
build_src_filter = +<common/> +<app_a2dp/>
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
build_flags =
    ${env.build_flags}
    -DCAN_TX_PIN=17
    -DCAN_RX_PIN=16

; ESP32-C3-DevKitM-1 + SN65HVD230 (avoid strapping pins 2/8/9 and USB 18/19)
[env:app_ble_esp32c3]
board = esp32-c3-devkitm-1
build_src_filter = +<common/> +<app_ble/>
lib_deps = h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0 ; Serial via CP2102
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4